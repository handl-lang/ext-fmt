[package]
name = "hnl-ext-fmt"
version = "0.1.0"
edition = "2024"
description = "`hnl fmt` — the canonical formatter as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-fmt"
homepage = "https://handl-lang.github.io/docs/ext-fmt/"
documentation = "https://handl-lang.github.io/docs/ext-fmt/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-fmt (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_fmt.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-fmt = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-detect = { git = "https://github.com/handl-lang/host", branch = "main" }
# PL-004: `hnl fmt`'s file paths run the desired-state pipeline —
# `hnl-tool-fmt`'s `FmtSource`/`FmtEmitter` registered on
# `handl-plugin-codegen`'s `CodegenRegistry` (the same `fmt` target
# `hnl codegen fmt` resolves), journaled under `.handl/codegen/`.
handl-plugin-codegen = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-tool-fmt = { git = "https://github.com/handl-lang/tool-fmt", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1

# Sibling checkouts for the PL-004 desired-state deps (same convention
# as ext-codegen/ext-codemod): the git deps resolve to the local
# `../host` / `../engine-*` trees.
[patch."https://github.com/handl-lang/host"]
handl-plugin-codegen = { path = "../host/crates/plugin-codegen" }
handl-plugin-ext-fmt = { path = "../host/crates/plugin-ext-fmt" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-ext-detect = { path = "../host/crates/plugin-ext-detect" }
handl-platform = { path = "../host/crates/platform" }
handl-kit-data-prelude = { path = "../host/crates/handl-kit-data-prelude" }

[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }

[patch."https://github.com/handl-lang/tool-fmt"]
hnl-tool-fmt = { path = "../tool-fmt" }

[patch."https://github.com/handl-lang/tool-lex-pattern"]
hnl-tool-lex-pattern = { path = "../tool-lex-pattern" }
